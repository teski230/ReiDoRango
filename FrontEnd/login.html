<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Rei do Rango</title>

  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-color: #ffffff;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    body::before {
      content: "";
      position: absolute;
      width: 100%;
      height: 100%;
      background-image: url('Rango.png');
      background-size: cover;
      background-position: center;
      opacity: 0.15;
      z-index: -1;
    }

    .login-container {
      background: #fff;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
      text-align: center;
      border-bottom: 6px solid #ff3131;
    }

    h2 {
      font-family: 'Bebas Neue';
      color: #ff3131;
      font-size: 40px;
      margin-bottom: 20px;
    }

    .form-group {
      text-align: left;
      margin-bottom: 20px;
    }

    label {
      font-size: 13px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 2px solid #eee;
      margin-top: 5px;
    }

    .btn-login {
      width: 100%;
      background: #ff3131;
      color: white;
      padding: 14px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
    }

    .btn-login:hover {
      background: #d62828;
    }

    .voltar {
      position: absolute;
      top: 20px;
      left: 20px;
      text-decoration: none;
      color: #ff3131;
      font-weight: 600;
    }
  </style>
</head>

<body>

<a href="index.html" class="voltar">← Voltar</a>

<div class="login-container">
  <h2>LOGIN</h2>

  <form>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" required>
    </div>

    <div class="form-group">
      <label>Senha</label>
      <input type="password" id="senha" required>
    </div>

    <button type="submit" class="btn-login">
    Entrar
    </button>

    <div class="login-link">
    <a href="recuperar-senha.html">Esqueci minha SENHA</a>
    </div>
  </form>
</div>

<script>
  document.querySelector("form").addEventListener("submit", async function(e){
    e.preventDefault();

    const email = document.getElementById("email").value;
    const senha = document.getElementById("senha").value;

    if (email === "" || senha === "") {
    alert("Preencha todos os campos!");
    return;
    }

    try {
      const resposta = await fetch("http://localhost:3000/login", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ email, senha })
      });

      const dados = await resposta.json();

      console.log(dados);

      if (dados.token) {

        // 🔥 SALVA TOKEN (UMA VEZ SÓ)
        localStorage.setItem("token", dados.token);

        const payload = JSON.parse(atob(dados.token.split('.')[1]));

        alert("Login realizado com sucesso!");

        // 🔥 REDIRECIONAMENTO CORRETO
        if (payload.role === "admin") {
          window.location.href = "admin.html";
        } else {
          window.location.href = "cardapio.html";
        }

      } else {
        alert(dados.mensagem || "Erro no login");
      }

    } catch (erro) {
      console.error(erro);
      alert("Erro ao conectar com o servidor");
    }
  });
</script>

</body>
</html>
