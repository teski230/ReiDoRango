<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar senha | Rei do Rango</title>

  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      padding: 20px;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: url('Rango.png');
      background-size: cover;
      background-position: center;
      opacity: 0.15;
      z-index: -1;
    }

    .login-container {
      background: #fff;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
      text-align: center;
      border-bottom: 6px solid #ff3131;
    }

    h2 {
      font-family: 'Bebas Neue';
      color: #ff3131;
      font-size: 40px;
      margin-bottom: 8px;
    }

    .descricao {
      font-size: 13px;
      color: #666;
      margin-bottom: 20px;
    }

    .form-group {
      text-align: left;
      margin-bottom: 20px;
    }

    label {
      font-size: 13px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 2px solid #eee;
      margin-top: 5px;
    }

    .btn-login {
      width: 100%;
      background: #ff3131;
      color: white;
      padding: 14px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
    }

    .btn-login:hover {
      background: #d62828;
    }

    .btn-login:disabled {
      opacity: 0.6;
      cursor: default;
    }

    .voltar {
      position: absolute;
      top: 20px;
      left: 20px;
      text-decoration: none;
      color: #ff3131;
      font-weight: 600;
    }
  </style>
</head>

<body>

<a href="login.html" class="voltar">← Voltar</a>

<div class="login-container">
  <h2>RECUPERAR SENHA</h2>
  <p class="descricao">Confirme o email e o telefone do seu cadastro e crie uma senha nova.</p>

  <form>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" required>
    </div>

    <div class="form-group">
      <label>Telefone cadastrado</label>
      <input type="tel" id="telefone" placeholder="(18) 99999-9999" required>
    </div>

    <div class="form-group">
      <label>Nova senha</label>
      <input type="password" id="novaSenha" minlength="6" required>
    </div>

    <div class="form-group">
      <label>Confirmar nova senha</label>
      <input type="password" id="confirmarSenha" minlength="6" required>
    </div>

    <button type="submit" class="btn-login">
    Alterar senha
    </button>

    <div class="login-link">
    <a href="login.html">Lembrei minha senha</a>
    </div>
  </form>
</div>

<script>
  const API_URL = "http://localhost:3000";

  document.querySelector("form").addEventListener("submit", async function(e){
    e.preventDefault();

    const email = document.getElementById("email").value.trim();
    const telefone = document.getElementById("telefone").value.trim();
    const novaSenha = document.getElementById("novaSenha").value;
    const confirmarSenha = document.getElementById("confirmarSenha").value;
    const botao = document.querySelector(".btn-login");

    if (!email || !telefone || !novaSenha || !confirmarSenha) {
      alert("Preencha todos os campos!");
      return;
    }

    if (novaSenha.length < 6) {
      alert("A nova senha precisa ter pelo menos 6 caracteres.");
      return;
    }

    if (novaSenha !== confirmarSenha) {
      alert("As senhas não são iguais.");
      return;
    }

    botao.disabled = true;

    try {
      const resposta = await fetch(`${API_URL}/recuperar-senha`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ email, telefone, novaSenha })
      });

      const conteudo = await resposta.text();
      let dados = {};

      try {
        dados = conteudo ? JSON.parse(conteudo) : {};
      } catch {
        throw new Error(`O servidor respondeu HTTP ${resposta.status}. Confira se a rota /recuperar-senha existe no backend.`);
      }

      if (!resposta.ok) {
        alert(dados.message || dados.mensagem || "Não foi possível alterar a senha.");
        return;
      }

      alert(dados.message || "Senha alterada com sucesso!");
      window.location.href = "login.html";

    } catch (erro) {
      console.error(erro);
      alert(erro.message || "Erro ao conectar com o servidor");
    } finally {
      botao.disabled = false;
    }
  });
</script>

</body>
</html>
